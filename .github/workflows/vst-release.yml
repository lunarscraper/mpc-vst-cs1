name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
        default: 0.1.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  cs1:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@259f75d0ce0f836cfd89cc0a33c550b55917cffc
    permissions:
      contents: write
    with:
      tag: cs1-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 259f75d0ce0f836cfd89cc0a33c550b55917cffc
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: cs1
      license: GPL-3.0-only
      about: CS-1, twochannels' CS-80-style synthesizer firmware for the M-VAVE FM-1, as an instrument - 8 voices of two channels (I and II) with HPF and LPF, filter and VCA envelopes, touch response, sub oscillator, ring modulator, chorus, delay, phaser and plate with shimmer; 69 sounds, 32 user slots with LOAD/SAVE, RANDOM with UNDO.
      dry_run: ${{ inputs.dry_run }}
